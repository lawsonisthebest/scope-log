name: Publish GitHub Pages link

on:
  push:
    branches: [main]
    paths:
      - scripts/build-pages.mjs
      - .github/workflows/pages.yml
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Generate link to the live app
        run: node scripts/build-pages.mjs
        env:
          LIVE_SITE_URL: ${{ vars.LIVE_SITE_URL }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .pages
      - name: Publish
        id: deployment
        uses: actions/deploy-pages@v4
